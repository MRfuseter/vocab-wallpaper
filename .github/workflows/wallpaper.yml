name: Daily vocab wallpaper

on:
  schedule:
    # GitHub มักรัน cron ช้ากว่าที่ตั้งไว้ 1–3 ชม. (โดยเฉพาะนาทีที่ :00)
    # จึงเริ่มรันตั้งแต่หลังเที่ยงคืนเวลาไทย และรันซ้ำเผื่อไว้ ถ้าภาพเหมือนเดิมจะไม่ commit
    - cron: '17 17 * * *' # 00:17 เวลาไทย
    - cron: '47 18 * * *' # 01:47 เวลาไทย
    - cron: '23 20 * * *' # 03:23 เวลาไทย
  workflow_dispatch:
    inputs:
      day:
        description: 'บังคับวัน (เว้นว่าง = อัตโนมัติ)'
        required: false

permissions:
  contents: write

concurrency:
  group: wallpaper
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render wallpapers
        run: npm run build
        env:
          DAY: ${{ inputs.day }}
          # START_DATE: '2026-10-28'  # วันที่ของ Day 1
          # DAY_MODE: unchecked       # ถ้าอยากให้เลื่อนวันเฉพาะตอนติ๊ก "ท่องแล้ว"

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "ไม่มีอะไรเปลี่ยน" && exit 0
          git commit -m "wallpaper: $(jq -r '"Day \(.day)/\(.totalDays)"' docs/today.json)"
          git push
